name: Refresh

on:
  schedule:
    # 06:00 NZST (UTC+12) = 18:00 UTC. In NZDT (Sep–Apr) this lands at 07:00 local.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "screener/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch from Apify
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m screener.fetch

      - name: Score
        run: python -m screener.score

      - name: Build
        run: python -m screener.build

      - name: Commit refreshed data + dist
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "tender-screener-bot"
          git config user.email "tender-screener-bot@users.noreply.github.com"
          git add data/raw.json data/scored.json data/raw_meta.json dist/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh tender data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
